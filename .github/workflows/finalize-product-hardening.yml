name: Finalize product hardening

on:
  push:
    branches:
      - codex/revela-offer-and-trust-overhaul

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/revela-offer-and-trust-overhaul
          fetch-depth: 0

      - name: Wire dashboard, checkout idempotency, and admin secret
        run: |
          python - <<'PY'
          from pathlib import Path

          report = Path('src/components/Report.tsx')
          text = report.read_text()
          old_import = "import { Scene, ScenePhotoPrompt, useIllustrations } from './Illustrations';"
          new_import = old_import + "\nimport ResetDashboard from './ResetDashboard';"
          if old_import not in text:
              raise SystemExit('Report illustration import was not found')
          text = text.replace(old_import, new_import, 1)
          marker = "        </section>\n\n        <Section eyebrow=\"Start here\" title=\"Your first pattern interrupt\">"
          replacement = "        </section>\n\n        <ResetDashboard answers={answers} archetypeName={view.archetypeName} />\n\n        <Section eyebrow=\"Start here\" title=\"Your first pattern interrupt\">"
          if marker not in text:
              raise SystemExit('Full report dashboard insertion marker was not found')
          report.write_text(text.replace(marker, replacement, 1))

          checkout = Path('server/queries/checkout.ts')
          text = checkout.read_text()
          old_headers = "        headers: { 'content-type': 'application/x-www-form-urlencoded' },"
          new_headers = "        headers: {\n          'content-type': 'application/x-www-form-urlencoded',\n          'Idempotency-Key': `revela-checkout-${input.token}-v2`,\n        },"
          if old_headers not in text:
              raise SystemExit('Checkout headers marker was not found')
          checkout.write_text(text.replace(old_headers, new_headers, 1))

          tracking = Path('server/queries/tracking.ts')
          text = tracking.read_text()
          import_marker = 'import { getDb } from "./connection";'
          if 'import { env } from "../lib/env";' not in text:
              if import_marker not in text:
                  raise SystemExit('Tracking import marker was not found')
              text = text.replace(import_marker, import_marker + '\nimport { env } from "../lib/env";', 1)
          old_password = 'const ADMIN_PASSWORD = process.env.ADMIN_PASSWORD ?? "2026";'
          if old_password not in text:
              raise SystemExit('Legacy admin password marker was not found')
          tracking.write_text(text.replace(old_password, 'const ADMIN_PASSWORD = env.adminPassword;', 1))

          legal = Path('src/pages/Legal.tsx')
          text = legal.read_text()
          old_storage = 'save unfinished progress, restore your result, and cache optional generated illustrations.'
          new_storage = 'save unfinished progress, restore your result, store private Reset actions and date entries, and cache optional generated illustrations.'
          if old_storage not in text:
              raise SystemExit('Privacy storage sentence was not found')
          legal.write_text(text.replace(old_storage, new_storage, 1))

          workflow = Path('.github/workflows/finalize-product-hardening.yml')
          workflow.unlink()
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm run test -- --passWithNoTests

      - name: Build web and both API functions
        run: npm run build

      - name: Commit verified source changes
        run: |
          git checkout -- api/index.mjs
          rm -f api/stripe-webhook.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/components/Report.tsx \
            server/queries/checkout.ts \
            server/queries/tracking.ts \
            src/pages/Legal.tsx \
            .github/workflows/finalize-product-hardening.yml
          git commit -m 'Wire dashboard, webhook, and final security hardening'
          git push origin HEAD:codex/revela-offer-and-trust-overhaul
