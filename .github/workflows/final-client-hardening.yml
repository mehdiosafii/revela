name: Final client and routing hardening

on:
  push:
    branches:
      - codex/revela-offer-and-trust-overhaul

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/revela-offer-and-trust-overhaul
          fetch-depth: 0

      - name: Apply final compatibility and routing patches
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          quiz = Path('src/components/Quiz.tsx')
          quiz_text = quiz.read_text()
          marker = 'maxLength={800}'
          if quiz_text.count(marker) != 1:
              raise SystemExit('Expected one free-choice answer limit marker')
          quiz.write_text(quiz_text.replace(marker, 'maxLength={300}', 1))

          vercel = Path('vercel.json')
          config = json.loads(vercel.read_text())
          config['rewrites'] = [
              {'source': '/api/((?!stripe-webhook).*)', 'destination': '/api/index'},
              {'source': '/((?!api/).*)', 'destination': '/index.html'},
          ]
          vercel.write_text(json.dumps(config, indent=2) + '\n')

          Path('.github/workflows/final-client-hardening.yml').unlink()
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm run test -- --passWithNoTests

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build web and API functions
        run: npm run build

      - name: Commit verified patches
        run: |
          git checkout -- api/index.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/Quiz.tsx vercel.json .github/workflows/final-client-hardening.yml
          git commit -m 'Finish answer limits and webhook routing hardening'
          git push origin HEAD:codex/revela-offer-and-trust-overhaul
